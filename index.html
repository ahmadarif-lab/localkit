<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--seo-head-->
    <meta name="theme-color" content="#fbf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      /* Boot screen: shown until the app has mounted. The static, crawlable
         copy inside #app stays in the DOM for search engines and no-JS
         visitors but is not painted while the app is loading. */
      #app > .seo-static {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap;
      }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--bg, #fbf8f5); transition: opacity 0.25s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot div {
        display: grid; justify-items: center; gap: 22px;
        /* fast loads never see it: the mark only fades in after a short wait */
        animation: boot-in 0.3s ease 0.35s both;
      }
      #boot svg { width: 56px; height: 56px; filter: drop-shadow(0 10px 18px rgb(242 107 29 / 0.25)); }
      #boot i {
        display: block; width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
        background: rgb(242 107 29 / 0.15); position: relative;
      }
      #boot i::after {
        content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit;
        background: #f26b1d; animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-in { from { opacity: 0; } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
    <noscript>
      <style>
        #boot { display: none; }
        #app > .seo-static { position: static; width: auto; height: auto; overflow: visible; clip-path: none; white-space: normal; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div>
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#f26b1d"/><path d="M10 7.5h8.2L23 12.3V23a1.5 1.5 0 0 1-1.5 1.5h-11.5A1.5 1.5 0 0 1 8.5 23V9a1.5 1.5 0 0 1 1.5-1.5Z" fill="#fff"/><path d="M12 16h7M12 19h5" stroke="#f26b1d" stroke-width="1.6" stroke-linecap="round"/><circle cx="22.5" cy="22.5" r="5" fill="#1d1a17" stroke="#f26b1d" stroke-width="1.6"/><path d="m20.4 22.6 1.4 1.4 2.8-2.9" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <i></i>
      </div>
    </div>
    <div id="app"><!--seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
